name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Stagehand v4 loads its runtime as an extension over CDP, which needs a recent Chrome.
      - name: Install Chrome for Testing
        run: |
          npx -y @puppeteer/browsers install chrome@stable --path "$HOME/cft" | tail -1 > cft.txt
          echo "LAB_CHROME_PATH=$(awk '{print $2}' cft.txt)" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test

  # Release gate: every committed regression fixture must pass with the current agent.
  regression-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Replay fixtures against the current agent (v1)
        run: npm run lab -- compare fixtures --agents v1 --trials 3
      - name: Upload run reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-runs
          path: runs/**/report.md
