name: Release

on:
  push:
    tags:
      - "v*"
  # Manual run: builds every installer and checks the artifact hand-off, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The gates run here, once, rather than inside the build matrix. `npm test` needs Postgres and a
  # browser, and macOS/Windows runners cannot declare `services:` at all — run there, the step hung
  # for six hours until GitHub's job limit cancelled every build. A tag can be pushed at any time,
  # so the release still cannot assume ci passed; `build` waits on this job instead.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: walkcast
          POSTGRES_PASSWORD: walkcast
          POSTGRES_DB: walkcast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U walkcast" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://walkcast:walkcast@127.0.0.1:5432/walkcast_test
      LAB_LOG: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: ffmpeg with the flite voice (narration tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Stagehand v4 loads its runtime as an extension over CDP, which needs a recent Chrome.
      - name: Install Chrome for Testing
        run: |
          npx -y @puppeteer/browsers install chrome@stable --path "$HOME/cft" | tail -1 > cft.txt
          echo "LAB_CHROME_PATH=$(awk '{print $2}' cft.txt)" >> "$GITHUB_ENV"
      - name: Lint, typecheck and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm run ui:build
          npm run web:build
          npm test
      - name: Migrations apply cleanly and are idempotent
        env:
          SUPABASE_DB_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run lab -- db migrate && npm run lab -- db migrate

  build:
    needs: verify
    # A hung step (v0.3.4 sat six hours) should fail in an hour, not hold the release all day.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      # Shipped in the installer (desktop.env) so sign-in goes through the project's Supabase Auth.
      # Both are public by design (the anon key can't read RLS-protected tables); they are repo
      # variables, not secrets. Staging fails if either is missing, instead of shipping a build
      # with local-only accounts.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      WALKCAST_REQUIRE_ACCOUNTS: "1"
    steps:
      - uses: actions/checkout@v7

      # The website links to releases/latest/download/walkcast_<version>_x64-setup.exe, so a tag that
      # does not match the app version silently breaks the download button.
      - name: Tag matches the app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        # libdbus-1-dev + pkg-config: the keyring crate's Secret Service backend (master key).
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - run: npm ci
      # Lint, typecheck and tests happen once in the `verify` job this build depends on; running
      # them per-platform is what hung the matrix.
      - run: npm run ui:build
      # stage-sidecar copies this into the installer: without it the app records video and captions
      # only, because nothing on a user's machine is guaranteed to have ffmpeg.
      - name: Fetch a static ffmpeg for the installer
        run: node apps/desktop/scripts/fetch-ffmpeg.mjs
      - name: Stage sidecar
        run: npm run desktop:stage
      # After Stage sidecar, never before: tauri-build resolves tauri.conf.json's externalBin and
      # resources while compiling, so on a fresh checkout `cargo test` fails with "resource path
      # `binaries/walkcast-node-<triple>` doesn't exist" until the sidecar is staged.
      - name: Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      # Optional Windows code signing (docs/SIGNING.md). Runs only when the repository has the
      # WINDOWS_CERTIFICATE (base64 .pfx) and WINDOWS_CERTIFICATE_PASSWORD secrets; without them the
      # build is unsigned exactly as before. The certificate goes into the runner's user store and is
      # used by thumbprint, so the password never appears on a command line. Signing happens inside
      # `tauri build` (bundle.windows.signCommand), before the updater's minisign .sig is computed:
      # signing the installer afterwards would change its bytes and break every in-app update.
      - name: Prepare Windows code signing
        id: winsign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            echo "::notice::WINDOWS_CERTIFICATE secrets not set; building unsigned Windows installers"
            echo "config=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "walkcast-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          $sign = "`"$($signtool.FullName)`" sign /sha1 $($cert.Thumbprint) /fd SHA256 /tr http://timestamp.digicert.com /td SHA256"
          # The bundled Node (src-tauri/binaries) ships inside the installer: sign it before bundling.
          Get-ChildItem apps/desktop/src-tauri/binaries -Filter *.exe | ForEach-Object {
            & $signtool.FullName sign /sha1 $cert.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing $($_.Name) failed" }
          }
          $config = Join-Path $env:RUNNER_TEMP "tauri.signing.json"
          @{ bundle = @{ windows = @{ signCommand = "$sign %1" } } } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $config
          echo "config=$config" >> $env:GITHUB_OUTPUT
      - name: Build Tauri
        shell: bash
        run: |
          # With signing prepared, merge in the signCommand; otherwise build unsigned as before.
          if [ -n "${{ steps.winsign.outputs.config }}" ]; then
            npx tauri build --target ${{ matrix.target }} --config "${{ steps.winsign.outputs.config }}"
          else
            npx tauri build --target ${{ matrix.target }}
          fi
        env:
          # Unsigned unless the Windows signing secrets above exist (then SmartScreen reputation
          # builds on the certificate). Linux packages are never OS-signed.
          TAURI_BUNDLE_ENABLED: "true"
          # Not OS code signing: the free minisign key the in-app updater verifies downloads with
          # (pubkey in tauri.conf.json). Produces a .sig next to each updatable installer.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: walkcast-${{ matrix.target }}
          # Only the installers. bundle/ also holds Tauri's staging trees (the expanded .app, and the
          # unpacked .deb/.rpm payloads with the sidecar's node_modules), which are not releases.
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  # Install the Windows installer this run built, on a clean runner, and check the app server it
  # ships actually starts, before anyone can download it. What it proves:
  #   1. the NSIS installer installs silently (per-user) and lays down walkcast.exe, the bundled
  #      Node, the pre-bundled server (sidecar.mjs) and its node_modules;
  #   2. that installed Node + server boot and answer /healthz and /readyz, and stop cleanly on
  #      POST /api/shutdown (run directly, on a spare port, so this does not depend on a GUI);
  #   3. best effort: walkcast.exe itself starts its server on 4317 (a GUI app on a CI desktop
  #      can be flaky, so this one only warns);
  #   4. the uninstaller removes it.
  # It does not sign in, record, or exercise the in-app updater.
  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: walkcast-x86_64-pc-windows-msvc
          path: artifacts
      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer in the build artifact" }
          echo "Installing $($setup.Name)"
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA", "$env:ProgramFiles" -Recurse -Depth 2 -Filter walkcast.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "walkcast.exe not found after install" }
          echo "INSTALL_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
          echo "Installed to $($exe.DirectoryName)"
      - name: Installed server boots and shuts down cleanly
        shell: pwsh
        run: |
          $dir = $env:INSTALL_DIR
          $node = Get-ChildItem $dir -Filter "walkcast-node*.exe" | Select-Object -First 1
          $bundle = Get-ChildItem $dir -Recurse -Filter sidecar.mjs | Select-Object -First 1
          if (-not $node -or -not $bundle) { throw "bundled Node or sidecar.mjs missing from the install" }
          $data = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "walkcast-data")
          $env:LAB_AUTH = "off"
          $env:WALKCAST_SHUTDOWN_TOKEN = "smoke-token"
          # Chromium downloads on first run; point it at an empty temp dir so it does not matter.
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP "browsers"
          $proc = Start-Process $node.FullName -ArgumentList "`"$($bundle.FullName)`"", "--port", "4399" -WorkingDirectory $data -PassThru -RedirectStandardOutput server.out -RedirectStandardError server.err
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:4399/healthz -TimeoutSec 2; if ($h.ok) { $ok = $true; break } } catch {}
            Start-Sleep 1
          }
          Get-Content server.out, server.err -ErrorAction SilentlyContinue | Select-Object -Last 30
          if (-not $ok) { throw "/healthz never answered" }
          Invoke-RestMethod http://127.0.0.1:4399/readyz | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post http://127.0.0.1:4399/api/shutdown -Headers @{ "x-walkcast-shutdown" = "smoke-token" } | ConvertTo-Json -Compress
          if (-not $proc.WaitForExit(30000)) { Stop-Process -Id $proc.Id -Force; throw "server did not exit after /api/shutdown" }
          echo "server exited with $($proc.ExitCode)"
      - name: The app starts its own server (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:WALKCAST_NO_AUTO_UPDATE = "1"
          $app = Start-Process (Join-Path $env:INSTALL_DIR "walkcast.exe") -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { if ((Invoke-RestMethod http://127.0.0.1:4317/healthz -TimeoutSec 2).ok) { $ok = $true; break } } catch {}
            Start-Sleep 1
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process walkcast-node -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { echo "::warning::walkcast.exe did not bring its server up on 4317 on the CI desktop"; exit 1 }
          echo "walkcast.exe started its server on 4317"
      - name: Uninstall
        if: always() && env.INSTALL_DIR != ''
        shell: pwsh
        run: |
          Get-Process walkcast, walkcast-node -ErrorAction SilentlyContinue | Stop-Process -Force
          $uninstall = Join-Path $env:INSTALL_DIR "uninstall.exe"
          if (-not (Test-Path $uninstall)) { throw "uninstall.exe missing" }
          Start-Process $uninstall -ArgumentList "/S" -Wait
          Start-Sleep 5
          if (Test-Path (Join-Path $env:INSTALL_DIR "walkcast.exe")) { throw "walkcast.exe still present after uninstall" }

  # Published as a draft: nothing is downloadable and releases/latest/download/latest.json (the
  # in-app updater feed, and the website's download links) keeps pointing at the previous release
  # until `promote` flips it. See docs/releases/v0.10.0-checklist.md for rollback.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # The feed the in-app updater polls (releases/latest/download/latest.json). A manual run
      # names it after the app version so the dry run checks it too.
      - name: Updater manifest
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          tag=${{ github.event_name == 'push' && github.ref_name || '' }}
          node apps/desktop/scripts/updater-manifest.mjs artifacts "${tag:-v$version}"
          cat artifacts/latest.json
      - name: List installers
        run: ls -laR artifacts
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          name: Walkcast ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only after the installer passed its smoke test: publish the draft and mark it latest, which is
  # the moment every installed app's updater and the website's download links move to it.
  promote:
    needs: [publish, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the draft as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --prerelease=false --latest
      - name: Updater feed points at this release
        run: |
          for i in 1 2 3 4 5 6; do
            version=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" | jq -r .version) || true
            [ "v$version" = "${{ github.ref_name }}" ] && echo "latest.json -> $version" && exit 0
            sleep 10
          done
          echo "::error::releases/latest/download/latest.json does not report ${{ github.ref_name }}"
          exit 1
