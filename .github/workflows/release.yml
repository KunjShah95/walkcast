name: release

# Push a tag like v0.1.0 to build the Windows installers and publish them to a GitHub release.
# The tag must match "version" in apps/desktop/src-tauri/tauri.conf.json: the website links to
# releases/latest/download/walkcast_<version>_x64-setup.exe (and the .msi), so the file names
# Tauri produces have to carry that version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: npm ci

      # The installer ships ffmpeg (stage-sidecar.ts copies WALKCAST_FFMPEG): the static "essentials"
      # build has libx264; narration on Windows comes from the system's own speech engine.
      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile $zip
          $want = (Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256).Content.Trim()
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "ffmpeg checksum mismatch: $got vs $want" }
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          & $exe.FullName -hide_banner -encoders | Select-String libx264
          "WALKCAST_FFMPEG=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # tauri build runs beforeBuildCommand (dashboard build + sidecar staging) itself.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: Walkcast ${{ github.ref_name }}
          releaseBody: |
            Windows 10 or 11, 64-bit.

            - **walkcast_*_x64-setup.exe**: recommended. Installs for your user account, no admin rights needed.
            - **walkcast_*_x64_en-US.msi**: installs for every user on the PC (Intune, Group Policy).
          releaseDraft: true
          prerelease: false
