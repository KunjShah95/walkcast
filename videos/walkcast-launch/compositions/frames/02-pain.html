  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="02-pain"]');
      var DUR = 3.819;

      var flashEl = root.querySelector("#f02-pain-flash");
      var line1 = root.querySelector("#f02-pain-line1");
      var line2 = root.querySelector("#f02-pain-line2");
      var line3 = root.querySelector("#f02-pain-line3");
      var underline = root.querySelector("#f02-pain-underline");

      var lines = [line1, line2, line3];

      // Sparse discrete-text-sequence beat schedule: one pain line active at a
      // time, swapped by a hard instant cut (no animation between states).
      var BEATS = [
        { t: 0.0, idx: 0 },
        { t: 1.1, idx: 1 },
        { t: 2.4, idx: 2 },
      ];

      function activeIndexAt(time) {
        for (var i = BEATS.length - 1; i >= 0; i--) {
          if (time >= BEATS[i].t) return BEATS[i].idx;
        }
        return -1;
      }

      var tl = gsap.timeline({ paused: true });

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var active = activeIndexAt(driver.t);
            for (var i = 0; i < lines.length; i++) {
              lines[i].style.opacity = i === active ? "1" : "0";
            }
          },
        },
        0,
      );

      // Flash-cut pulse at each beat threshold — a quick cream flash, not a fade.
      BEATS.forEach(function (beat) {
        tl.fromTo(
          flashEl,
          { opacity: 0.22 },
          { opacity: 0, duration: 0.14, ease: "power1.out" },
          beat.t,
        );
      });

      // Coral underline flicks under "click" as the voiceover names it.
      tl.fromTo(
        underline,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.22, ease: "power2.out" },
        1.25,
      );

      tl.progress(0); // force the initial render state deterministically

      window.__timelines = window.__timelines || {};
      window.__timelines["02-pain"] = tl;
    })();
