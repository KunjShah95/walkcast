  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-1.8s) — hard-cut kicker flash, then the mark + wordmark spring-pop.
      tl.fromTo("#pi03-kicker-el", { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, 0.08);

      tl.fromTo(
        "#pi03-wordmark-el",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.9
      );

      // Scene 2 (1.8-5.397s) — tagline types on beneath the (now-locked) wordmark.
      var FULL_TEXT = "paste a link — a real browser does the walk";
      var TYPE_START = 1.8;
      var TYPE_DUR = 2.5;
      var DURATION = 5.397;

      var tagEl = document.getElementById("pi03-tagline-el");
      var cursorEl = document.getElementById("pi03-cursor-el");

      var typer = { v: 0 };
      tl.to(
        typer,
        {
          v: FULL_TEXT.length,
          duration: TYPE_DUR,
          ease: "power1.inOut",
          onUpdate: function () {
            tagEl.textContent = FULL_TEXT.substring(0, Math.floor(typer.v));
          },
        },
        TYPE_START
      );

      // Deterministic cursor blink across the whole typing + hold window.
      var BLINK_CYCLES = 6; // whole number over the (DURATION - TYPE_START) tail
      var blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * BLINK_CYCLES,
          duration: DURATION - TYPE_START,
          ease: "none",
          onUpdate: function () {
            var typingGrace = typer.v < FULL_TEXT.length;
            cursorEl.style.opacity = typingGrace ? "1" : (Math.sin(blink.p) > 0 ? "1" : "0");
          },
        },
        TYPE_START
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["03-product-intro"] = tl;
    })();
