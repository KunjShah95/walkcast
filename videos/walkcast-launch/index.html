      <!--
        Real demo.mp4 footage, Archetype B (composition-patterns.md): host-root
        media positioned over the 04/05 sub-comps, motion authored on the MAIN
        timeline below (a sub-comp timeline cannot reach a host-root element).
        Explicit z-index (not DOM order) decides stacking against each sub-
        comp's content: z-index:1 puts the video above a frame's own full-bleed
        background regardless of DOM order; frame 05's chip/kinetic-text
        elements carry z-index:2 in their own stylesheet so they stay above
        the video as it slides out from under them. Two elements, not one
        continuous clip, because the frame changes shape between the "browser
        window" (04) and "large centered, then yields left" (05) treatments.
      -->
      <video
        id="demo-video-a"
        class="clip"
        src="assets/demo.mp4"
        poster="assets/demo-poster.jpg"
        data-start="11.349"
        data-duration="5.193"
        data-track-index="30"
        muted
        playsinline
        style="position:absolute; left:784px; top:124px; width:1056px; height:660px; object-fit:cover; border-radius:12px; border:1px solid rgba(30,26,22,0.14); box-shadow:0 1px 3px rgba(30,26,22,0.08), 0 4px 16px rgba(30,26,22,0.08); transform-origin:50% 50%; z-index:1;"
      ></video>
      <video
        id="demo-video-b"
        class="clip"
        src="assets/demo.mp4"
        poster="assets/demo-poster.jpg"
        data-start="16.042"
        data-duration="3.55"

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-pain", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5.952);
        tl.fromTo("#el-03-product-intro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5.952);
        tl.to("#el-03-product-intro", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11.349);
        tl.fromTo("#el-04-demo-walk", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 11.349);
        tl.to("#el-04-demo-walk", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 16.042);
        tl.fromTo("#el-05-demo-output", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 16.042);
        tl.to("#el-05-demo-output", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23.167);
        tl.fromTo("#el-06-benefits", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23.167);
        tl.to({}, { duration: 31.53 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();

      // ── demo.mp4 motion (Archetype B host-media, composition-patterns.md) ──
      (function () { var tl = window.__timelines["main"];
        // Video A — the "browser window" over Frame 4: settle in, then one
        // continuous gentle push-in for the rest of its window, then fade out
        // in step with the 04→05 crossfade already tweened above.
        tl.fromTo("#demo-video-a", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 11.349);
        tl.fromTo("#demo-video-a", { scale: 1 }, { scale: 1.05, duration: 4.693, ease: "power1.inOut", immediateRender: false }, 11.849);
        tl.to("#demo-video-a", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 16.042);

        // Video B — large and centered over Frame 5 (continuing the handoff),
        // then yields left (the weight-transfer slide the chips/text fill
        // behind), then clears before the kinetic text pivot takes the center.
        tl.fromTo("#demo-video-b", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 16.042);
        tl.to("#demo-video-b", { x: -260, scale: 0.64, duration: 1.3, ease: "power3.out" }, 17.642);
        tl.to("#demo-video-b", { opacity: 0, duration: 0.35, ease: "power2.in" }, 19.242);
      })();
    </script>
