          - text: / Product demo videos
        - heading "How to make a product demo video of your web app" [level=1] [ref=f16e26]
        - paragraph [ref=f16e27]: "Record a narrated product demo of a SaaS or web app from its URL: which screens to show, how to keep the demo current after every release, and where to use it."
        - paragraph [ref=f16e28]:
          - text: For Founders, product marketers and sales engineers who need a demo that is always up to date. · Updated
          - time [ref=f16e29]: 2026-10-15
          - text: ·
          - link "Sources" [ref=f16e30] [cursor=pointer]:
            - /url: /#sources
        - paragraph [ref=f16e31]: "A product demo video shows what your app does by walking through it, not by describing it. The demos that work show the product with believable data, in the order a new customer would meet it: sign in, the main screen, the one thing they came for."
        - paragraph [ref=f16e32]: The hard part isn't recording the first demo, it's keeping it current. Every redesign makes the old video wrong. Recording from a link means the demo is a repeatable job, not a production.
        - heading "Step by step" [level=2] [ref=f16e33]
        - list [ref=f16e34]:
          - listitem [ref=f16e35]:
            - strong [ref=f16e36]: Prepare a demo account.
            - generic [ref=f16e37]: "Fill it with realistic sample data: real-looking company names, a few months of activity, no lorem ipsum. Empty states make a product look unused."
          - listitem [ref=f16e38]:
            - strong [ref=f16e39]: Start from the sign-in page.
            - generic [ref=f16e40]: Showing the sign-in tells viewers this is the real product, not a mock-up.
          - listitem [ref=f16e41]:
            - strong [ref=f16e42]: Limit it to the core flow.
            - generic [ref=f16e43]: Five to eight pages. A demo that shows every settings screen buries the point.
          - listitem [ref=f16e44]:
            - strong [ref=f16e45]: Record, then cut a teaser.
            - generic [ref=f16e46]: Use the full MP4 for sales follow-ups and the first 30 seconds as a teaser for the homepage or a social post.
        - heading "Settings that work" [level=2] [ref=f16e47]
        - table [ref=f16e48]:
          - rowgroup [ref=f16e49]:
            - row [ref=f16e50]:
              - rowheader "Pages" [ref=f16e51]
              - cell "5 to 8." [ref=f16e52]
            - row [ref=f16e53]:
              - rowheader "Account" [ref=f16e54]
              - cell "A demo workspace with curated sample data." [ref=f16e55]
            - row [ref=f16e56]:
              - rowheader "Where to start" [ref=f16e57]
              - cell "The sign-in page, then let it land on the main dashboard." [ref=f16e58]
        - heading "After recording" [level=2] [ref=f16e59]
        - list [ref=f16e60]:
          - listitem [ref=f16e61]: "Put the video above the fold on your pricing or product page with captions on: most autoplayed video is watched muted."
          - listitem [ref=f16e62]: Send the MP4 after a sales call so the buyer can show it to colleagues who weren't there.
          - listitem [ref=f16e63]: Re-record after each release that changes the main screens.
        - heading "Mistakes to avoid" [level=2] [ref=f16e64]
        - list [ref=f16e65]:
          - listitem [ref=f16e66]: Demo data with personal information. Generate it.
          - listitem [ref=f16e67]: "Starting on a settings or billing page: start where the value is."
          - listitem [ref=f16e68]: Leaving destructive actions on the demo account. The recorder skips delete and sign-out links and submits no forms, but your demo data should still be disposable.
        - heading "Questions" [level=2] [ref=f16e69]
        - generic [ref=f16e70]:
          - group [ref=f16e71]:
            - heading "What should a SaaS product demo video include?" [level=3] [ref=f16e73] [cursor=pointer]
            - paragraph [ref=f16e77]: Sign-in, the main dashboard and the one workflow customers buy the product for, with realistic data. Keep it under three minutes; offer a longer one on request.
          - group [ref=f16e78]:
            - heading "How do I keep a product demo video up to date?" [level=3] [ref=f16e80] [cursor=pointer]
            - paragraph [ref=f16e84]: "Make recording repeatable: same demo account, same start page, same number of pages. Then re-record after each release that changes what the demo shows."
          - group [ref=f16e85]:
            - heading "Can I use the demo on my website?" [level=3] [ref=f16e87] [cursor=pointer]
            - paragraph [ref=f16e91]: Yes. The MP4 plays in every browser and comes with a WebVTT caption file you can attach as a caption track.
