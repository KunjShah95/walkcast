      - generic [ref=f3e180]:
        - heading [level=2] [ref=f3e181]:
          - text: What is Walkcast?
          - generic [ref=f3e182]: A browser that tells you what it did.
        - paragraph [ref=f3e187]: Walkcast is a free, open-source tool that makes a narrated video walkthrough from a website link. A browser signs in, visits up to 30 pages on that site, and returns an MP4 with a spoken voice-over, WebVTT captions and a transcript. Every line comes from what the browser actually did.
        - paragraph [ref=f3e188]:
          - text: "See it in the recording: typing the username"
          - link "EX 2" [ref=f3e189] [cursor=pointer]:
            - /url: "#demo"
          - text: ", the password kept off screen"
          - link "EX 3" [ref=f3e190] [cursor=pointer]:
            - /url: "#demo"
          - text: ", sign-in confirmed"
          - link "EX 5" [ref=f3e191] [cursor=pointer]:
            - /url: "#demo"
          - text: . Updated
