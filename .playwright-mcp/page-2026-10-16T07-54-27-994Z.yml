        - heading "Walkcast vs recording it yourself." [level=2] [ref=f3e443]
        - paragraph [ref=f3e444]: A screen recorder captures your display while you talk. Walkcast drives a browser from a link and writes the narration from what that browser did. They are for different videos.
      - table [ref=f3e446]:
