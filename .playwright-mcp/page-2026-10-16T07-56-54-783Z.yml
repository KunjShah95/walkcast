        - heading "Walkcast vs recording it yourself." [level=2] [ref=f17e453]
        - paragraph [ref=f17e454]: A screen recorder captures your display while you talk. Walkcast drives a browser from a link and writes the narration from what that browser did. They are for different videos.
      - table [ref=f17e456]:
        - caption [ref=f17e457]: How the two ways of making a website walkthrough differ
        - rowgroup [ref=f17e458]:
          - row [ref=f17e459]:
