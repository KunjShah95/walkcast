            - cell "Signs in with a username and password held in memory. Stops at CAPTCHA and two-factor prompts." [ref=f17e474]
            - cell "You sign in yourself, including those prompts." [ref=f17e475]
          - row [ref=f17e476]:
            - rowheader "What you get" [ref=f17e477]
