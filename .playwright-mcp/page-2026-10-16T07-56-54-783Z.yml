      - generic [ref=f17e190]:
        - heading [level=2] [ref=f17e191]:
          - text: What is Walkcast?
          - generic [ref=f17e192]: A browser that tells you what it did.
        - paragraph [ref=f17e197]: Walkcast is a free, open-source tool that makes a narrated video walkthrough from a website link. A browser signs in, visits up to 30 pages on that site, and returns an MP4 with a spoken voice-over, WebVTT captions and a transcript. Every line comes from what the browser actually did.
        - paragraph [ref=f17e198]:
          - text: "See it in the recording: typing the username"
          - link "EX 2" [ref=f17e199] [cursor=pointer]:
            - /url: "#demo"
          - text: ", the password kept off screen"
          - link "EX 3" [ref=f17e200] [cursor=pointer]:
            - /url: "#demo"
          - text: ", sign-in confirmed"
          - link "EX 5" [ref=f17e201] [cursor=pointer]:
