        - heading "Walkcast vs recording it yourself." [level=2] [ref=f1e453]
        - paragraph [ref=f1e454]: A screen recorder captures your display while you talk. Walkcast drives a browser from a link and writes the narration from what that browser did. They are for different videos.
      - table [ref=f1e456]:
        - caption [ref=f1e457]: How the two ways of making a website walkthrough differ
        - rowgroup [ref=f1e458]:
