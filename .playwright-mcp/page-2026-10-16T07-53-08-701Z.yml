      - generic [ref=f1e190]:
        - heading [level=2] [ref=f1e191]:
          - text: What is Walkcast?
          - generic [ref=f1e192]: A browser that narrates what it did.
        - paragraph [ref=f1e197]: Walkcast is a free, open-source tool that makes a narrated video walkthrough from a website link. A browser signs in, visits up to 30 pages on that site, and returns an MP4 with a spoken voice-over, WebVTT captions and a transcript. Every line comes from what the browser actually did.
        - paragraph [ref=f1e198]:
          - text: "See it in the recording: typing the username"
          - link "EX 2" [ref=f1e199] [cursor=pointer]:
            - /url: "#demo"
          - text: ", the password kept off screen"
