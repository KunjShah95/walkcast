            - cell "Signs in with a username and password held in memory. Stops at CAPTCHA and two-factor prompts." [ref=f20e474]
            - cell "You sign in yourself, including those prompts." [ref=f20e475]
          - row [ref=f20e476]:
            - rowheader "What you get" [ref=f20e477]
