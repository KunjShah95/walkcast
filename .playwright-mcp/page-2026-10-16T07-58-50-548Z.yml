      - generic [ref=f20e190]:
        - heading [level=2] [ref=f20e191]:
          - text: What is Walkcast?
          - generic [ref=f20e192]: A browser that tells you what it did.
        - paragraph [ref=f20e197]: Walkcast is a free, open-source tool that makes a narrated video walkthrough from a website link. A browser signs in, visits up to 30 pages on that site, and returns an MP4 with a spoken voice-over, WebVTT captions and a transcript. Every line comes from what the browser actually did.
        - paragraph [ref=f20e198]:
          - text: "See it in the recording: typing the username"
          - link "EX 2" [ref=f20e199] [cursor=pointer]:
            - /url: "#demo"
          - text: ", the password kept off screen"
          - link "EX 3" [ref=f20e200] [cursor=pointer]:
            - /url: "#demo"
          - text: ", sign-in confirmed"
          - link "EX 5" [ref=f20e201] [cursor=pointer]:
            - /url: "#demo"
          - text: . Updated
