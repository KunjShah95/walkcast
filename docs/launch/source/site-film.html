<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css"><style>
*{box-sizing:border-box}html,body{width:100vw;height:100vh;margin:0;overflow:hidden;background:#090f18;color:#f8f7f2;font-family:'Schibsted Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
:root{--ink:#f8f7f2;--muted:#c0c6cd;--orange:#ff6a35;--ease:cubic-bezier(.16,1,.3,1)}
#stage{position:absolute;inset:0;overflow:hidden;background:#090f18}#stage[data-tone="cinematic"]{--orange:#e7ae78}#stage[data-tone="playful"]{--orange:#ff593d}.footage{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;object-position:top center;filter:saturate(.88);transform:scale(1.015);will-change:transform,filter}.wash{position:absolute;inset:0;background:linear-gradient(90deg,#090f18e8 0%,#090f18b0 42%,#090f1820 100%),linear-gradient(0deg,#090f18dc 0%,transparent 37%,#090f1859 100%)}
.grain{position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
.top{position:absolute;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:clamp(35px,5vw,88px);font:600 clamp(13px,.85vw,17px) 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#eef0f2}.brand{display:flex;align-items:center;gap:12px}.mark{width:12px;height:12px;border-radius:50%;background:var(--orange);box-shadow:0 0 22px #ff6a3580}.count{color:#c3c7c9}.count b{color:var(--orange);font-weight:600}
.body{position:absolute;left:clamp(52px,8vw,154px);top:50%;width:min(55vw,1050px);transform:translateY(-46%);display:grid;gap:clamp(18px,2.5vh,34px);transition:opacity .7s ease,transform .8s var(--ease)}.kicker{font:600 clamp(13px,.85vw,17px) 'JetBrains Mono',monospace;letter-spacing:.19em;text-transform:uppercase;color:var(--orange)}.headline{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(64px,8.4vw,160px);line-height:.9;letter-spacing:-.055em;font-weight:500;margin:0;max-width:1100px;text-wrap:balance}.headline em{font-style:normal;color:var(--orange)}.subtitle{font-size:clamp(18px,1.5vw,29px);line-height:1.42;color:#e1e1dc;max-width:700px;margin:0}.site{font:500 clamp(13px,.9vw,18px) 'JetBrains Mono',monospace;letter-spacing:.025em;color:#c0c6cd}.rule{width:58px;height:2px;background:var(--orange);margin-top:4px}
.chapter{position:absolute;right:clamp(40px,6vw,110px);bottom:clamp(100px,12vh,170px);max-width:min(33vw,580px);padding:22px 27px;border-left:2px solid var(--orange);background:#0b1118bf;backdrop-filter:blur(16px);opacity:0;transform:translateY(18px);transition:opacity .35s ease,transform .55s var(--ease)}.chapter.on{opacity:1;transform:translateY(0)}.chapter small{display:block;color:var(--orange);font:600 12px 'JetBrains Mono',monospace;letter-spacing:.15em;text-transform:uppercase;margin-bottom:9px}.chapter strong{display:block;font-family:'Instrument Serif',Georgia,serif;font-size:clamp(23px,2.1vw,40px);font-weight:500;line-height:1.04}.chapter span{display:block;margin-top:8px;color:#bdc3ca;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.end{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:8vw;background:#090f18f0;opacity:0;visibility:hidden;transition:opacity .6s ease}.end.on{opacity:1;visibility:visible}.end .headline{font-size:clamp(60px,8vw,150px);margin:20px auto;max-width:1300px}.end .site{color:#d0d2d1}.bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:#ffffff35;z-index:8}.bar i{display:block;height:100%;width:100%;background:var(--orange);transform:scaleX(0);transform-origin:left}
:root[data-format="vertical"] .body{width:80vw;left:10vw}:root[data-format="vertical"] .chapter{left:10vw;right:10vw;max-width:none;bottom:10vh}:root[data-format="vertical"] .footage{object-fit:contain;background:#0b1118}.top{z-index:3}.body,.chapter,.end,.bar,.grain{z-index:2}
</style></head><body><main id="stage"><video class="footage" muted playsinline preload="auto"><source src="fresh-capture.mp4" type="video/mp4"></video><div class="wash"></div><div class="grain"></div><header class="top"><div class="brand"><i class="mark"></i> <span id="host"></span></div><div class="count"><b>01</b> / <span id="count">01</span></div></header><section class="body"><div class="kicker" id="kicker">A real walkthrough</div><h1 class="headline" id="headline"></h1><div class="rule"></div><p class="subtitle" id="subtitle"></p><div class="site" id="site"></div></section><aside class="chapter" id="chapter"><small id="chapter-kicker"></small><strong id="chapter-title"></strong><span id="chapter-url"></span></aside><section class="end" id="end"><div class="kicker">Seen in one real visit</div><h2 class="headline" id="end-title"></h2><div class="site" id="end-host"></div></section><div class="bar"><i></i></div></main>
<script>
const D=__SITE_DATA__, $=id=>document.getElementById(id), video=document.querySelector('.footage'), chapters=D.chapters||[];
document.documentElement.dataset.format=D.format;$('stage').dataset.tone=D.tone;$('host').textContent=D.host;$('site').textContent=D.host;$('end-title').textContent=D.title;$('end-host').textContent=D.host;$('count').textContent=String(Math.max(1,chapters.length)).padStart(2,'0');
function setChapter(index){const c=chapters[index];if(!c)return;$('count').textContent=String(Math.max(1,chapters.length)).padStart(2,'0');document.querySelector('.count b').textContent=String(index+1).padStart(2,'0');$('chapter-kicker').textContent=`${String(index+1).padStart(2,'0')} / ${c.label}`;$('chapter-title').textContent=c.title;$('chapter-url').textContent=c.path;$('chapter').classList.add('on')}
window.render=async function(t){const endStart=D.duration-4,ending=t>=endStart,opening=t<4,body=document.querySelector('.body');$('end').classList.toggle('on',ending);$('chapter').classList.toggle('on',!ending&&!opening);body.style.opacity=opening?'1':'0';body.style.transform=opening?'translateY(-46%) translateX(0)':'translateY(-46%) translateX(-24px)';if(opening){$('kicker').textContent='A real walkthrough';$('headline').innerHTML=`Inside <em>${D.titleHtml}</em>`;$('subtitle').textContent='';document.querySelector('.count b').textContent='01'}else if(!ending){const exactTimeline=chapters.length>0&&chapters.every(c=>Number.isFinite(c.at));let i;if(exactTimeline){i=0;for(let n=0;n<chapters.length;n++)if(chapters[n].at<=t)i=n}else{i=Math.min(chapters.length-1,Math.floor((t-4)/Math.max(1,(endStart-4)/Math.max(1,chapters.length))))}setChapter(i)}const target=Math.min(D.captureDuration-.08,t);if(Math.abs(video.currentTime-target)>.05){await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);video.removeEventListener('seeked',finish);resolve()};const timer=setTimeout(finish,250);video.addEventListener('seeked',finish,{once:true});try{video.currentTime=target}catch{finish()}})}$('bar').firstElementChild.style.transform=`scaleX(${Math.min(1,t/D.duration)})`;video.style.transform=`scale(${1.015+Math.sin(t*.15)*.008})`;video.style.filter=`saturate(${.84+Math.sin(t*.12)*.05})`};
</script></body></html>
