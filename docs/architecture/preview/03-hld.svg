<text x="40" y="53.3" font-size="36" fill="#1e1e1e" text-anchor="start">Walkcast — High-level design (HLD)</text>
<text x="40" y="86.8" font-size="16" fill="#495057" text-anchor="start">Layers and the components in each, by module. Arrows show the main dependencies; every box names the code that implements it.</text>
<text x="36" y="150.5" font-size="20" fill="#1e1e1e" text-anchor="start">1 · Clients</text>
<text x="250.0" y="210.125" font-size="15" fill="#1e1e1e" text-anchor="middle">Visitor browser</text><text x="250.0" y="228.875" font-size="15" fill="#1e1e1e" text-anchor="middle">public pages, no JS needed</text>
<text x="670.0" y="210.125" font-size="15" fill="#1e1e1e" text-anchor="middle">Signed-in browser</text><text x="670.0" y="228.875" font-size="15" fill="#1e1e1e" text-anchor="middle">dashboard SPA (dashboard/src)</text>
<text x="1090.0" y="210.125" font-size="15" fill="#1e1e1e" text-anchor="middle">CLI · src/cli.ts — record · run · check</text><text x="1090.0" y="228.875" font-size="15" fill="#1e1e1e" text-anchor="middle">runs layer 3 in-process, no web tier</text>
<text x="1510.0" y="210.125" font-size="15" fill="#1e1e1e" text-anchor="middle">CI gate</text><text x="1510.0" y="228.875" font-size="15" fill="#1e1e1e" text-anchor="middle">npm run lab -- check (fixtures/)</text>
<text x="1940.0" y="210.125" font-size="15" fill="#1e1e1e" text-anchor="middle">Crawlers &amp; answer engines</text><text x="1940.0" y="228.875" font-size="15" fill="#1e1e1e" text-anchor="middle">robots.txt · sitemap · llms.txt</text>
