<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkcast</title>
<!-- Shown by the desktop shell while the app server starts; the shell then navigates to /app. -->
<style>
  :root { --paper: #ffffff; --ink: #1b1a17; --muted: #6b665d; --line: #e7e3db; --signal: #9c5700; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper: #141311; --ink: #f2efe9; --muted: #a39d92; --line: #2c2a26; } }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { height: 100%; display: grid; place-items: center; }
  .box { display: grid; justify-items: center; gap: 14px; }
  .name { font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
  .bar { width: 160px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--signal); animation: slide 1.1s cubic-bezier(.65,0,.35,1) infinite; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .5; } }
</style>
</head>
<body>
<main>
  <div class="box" role="status" aria-live="polite">
    <svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#874b00"/><path d="M11 26.5h8M14.5 37.5h4.5" stroke="#fff" stroke-width="3.6" stroke-linecap="round" opacity=".5"/><path d="M25.5 22.3v19.4c0 2.3 2.5 3.7 4.5 2.5l15.6-9.7c1.8-1.2 1.8-3.8 0-5L30 19.8c-2-1.2-4.5.2-4.5 2.5z" fill="#fff"/><circle cx="48" cy="16" r="7.4" fill="#fff"/><circle cx="48" cy="16" r="5" fill="#c0321c"/></svg>
    <span class="name">Walkcast</span>
    <div class="bar" aria-hidden="true"><i></i></div>
    <p>Starting…</p>
  </div>
</main>
</body>
</html>
