[package]
name = "walkcast"
version = "0.10.9"
description = "Walkcast desktop app"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Browser sign-in returns through the walkcast:// scheme instead of a fixed loopback port, so a
# taken port 4317 can no longer strand the flow. One instance only, so a second launch focuses the
# first instead of quietly stealing the preferred port.
tauri-plugin-deep-link = "2"
# "deep-link": on Windows and Linux a walkcast:// link starts a second process; this hands its URL
# to the deep-link plugin of the running app. Without it the URL was dropped and the window only
# came to the front, so browser sign-in never finished.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# "Walkthrough ready" when a job finishes while the window is closed or in the background.
tauri-plugin-notification = "2"
# The per-run shutdown token and the first-run master key.
getrandom = "0.3"

# The app server's master key lives in the OS keychain, not in a file beside the data it protects.
# One native store per platform; Secret Service on Linux needs libdbus-1-dev to build.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# Only so the tests can exercise Tauri's own capability-URL matcher against the pattern in
# capabilities/updates.json. Never linked into the app.
tauri-utils = "=2.10.2"
